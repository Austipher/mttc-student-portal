
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHGTTC Student Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #075985;
        }

        h2 {
            color: #075985;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #075985;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            border-radius: 8px;
        }

        button:hover {
            background: #064e75;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .message {
            font-size: 14px;
            color: #444;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGIN SECTION -->
    <div id="loginSection">

        <h1>MTTC Student Portal</h1>

        <p>Student Login</p>

        <input
            type="text"
            id="studentID"
            placeholder="Enter Student ID"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">Login</button>

        <p class="note">
            First-time password: <b>1234</b>
        </p>

    </div>


    <!-- CHANGE PASSWORD SECTION -->
    <div id="changePasswordSection" class="hidden">

        <h1>MTTC Student Portal</h1>

        <h2>Change Your Password</h2>

        <p class="message">
            You are using the temporary password <b>1234</b>.
            Please create your own password before continuing.
        </p>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter New Password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
        >

        <button onclick="changePassword()">
            Change Password
        </button>

    </div>

</div>


<script>

let currentStudentID = "";


/* =========================
   STUDENT LOGIN
   ========================= */

function login() {

    let id = document.getElementById("studentID").value.trim();
    let password = document.getElementById("password").value.trim();

    if (id === "") {
        alert("Please enter your Student ID.");
        return;
    }

    if (password === "") {
        alert("Please enter your password.");
        return;
    }


    /*
       Each student's password is stored separately.

       If no password has been created yet,
       the temporary password is 1234.
    */

    let savedPassword = localStorage.getItem("password_" + id);

    if (savedPassword === null) {
        savedPassword = "1234";
    }


    /* Check password */

    if (password !== savedPassword) {

        alert("Incorrect Student ID or password.");
        return;

    }


    /* Save current student */

    currentStudentID = id;

    localStorage.setItem("loggedInStudent", id);


    /*
       If the student is still using 1234,
       force them to create a new password.
    */

    if (savedPassword === "1234") {

        document.getElementById("loginSection").classList.add("hidden");

        document.getElementById("changePasswordSection")
            .classList.remove("hidden");

        return;
    }


    /*
       Student has already changed password.
       Continue to dashboard.
    */

    goToDashboard();

}


/* =========================
   CHANGE PASSWORD
   ========================= */

function changePassword() {

    let newPassword =
        document.getElementById("newPassword").value.trim();

    let confirmPassword =
        document.getElementById("confirmPassword").value.trim();


    if (newPassword === "") {

        alert("Please enter a new password.");
        return;

    }


    if (newPassword.length < 4) {

        alert("Password must contain at least 4 characters.");
        return;

    }


    if (newPassword === "1234") {

        alert("Please choose a password different from 1234.");
        return;

    }


    if (newPassword !== confirmPassword) {

        alert("The passwords do not match.");
        return;

    }


    /*
       Save the new password specifically
       for this student.
    */

    localStorage.setItem(
        "password_" + currentStudentID,
        newPassword
    );


    alert("Password changed successfully!");


    goToDashboard();

}


/* =========================
   OPEN DASHBOARD
   ========================= */

function goToDashboard() {

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
