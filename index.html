<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTTC Student Results Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #17365d;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2745;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        #results {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .student-info {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #17365d;
            color: white;
        }

        .summary {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>MTTC Student Results Portal</h1>
    <p>Check your assessment results</p>
</header>

<div class="container">

    <div class="search-box">
        <h2>Search Student Results</h2>

        <label>Enter Student ID or Name:</label>

        <input
            type="text"
            id="searchInput"
            placeholder="Example: MTTC001 or John Banda"
        >

        <button onclick="searchResults()">Search Results</button>

        <div id="message"></div>
    </div>


    <div id="results">

        <h2>Student Results</h2>

        <div class="student-info">
            <strong>Name:</strong> <span id="studentName"></span><br>
            <strong>Student ID:</strong> <span id="studentID"></span><br>
            <strong>Class:</strong> <span id="studentClass"></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody id="resultsTable">
            </tbody>
        </table>

        <div class="summary">
            Total Marks: <span id="totalMarks"></span><br>
            Average: <span id="averageMarks"></span>%
        </div>

    </div>

</div>

<footer>
    MTTC Student Portal
</footer>


<script>

    /*
    ==================================================
    STUDENT RESULTS DATABASE
    ==================================================

    ADD YOUR STUDENTS HERE.

    Change the sample names, IDs, subjects and marks
    to your own student information.
    */

    const students = [

        {
            id: "MTTC001",
            name: "John Banda",
            class: "Class D",

            results: [
                { subject: "English", marks: 75 },
                { subject: "Mathematics", marks: 82 },
                { subject: "Science", marks: 68 },
                { subject: "Social Studies", marks: 74 },
                { subject: "Agriculture", marks: 80 }
            ]
        },

        {
            id: "MTTC002",
            name: "Mary Phiri",
            class: "Class D",

            results: [
                { subject: "English", marks: 65 },
                { subject: "Mathematics", marks: 72 },
                { subject: "Science", marks: 78 },
                { subject: "Social Studies", marks: 70 },
                { subject: "Agriculture", marks: 66 }
            ]
        }

    ];


    /*
    ============================================
    AUTOMATIC GRADE
    ============================================
    */

    function getGrade(marks) {

        if (marks >= 80) {
            return "A";
        }

        if (marks >= 70) {
            return "B";
        }

        if (marks >= 60) {
            return "C";
        }

        if (marks >= 50) {
            return "D";
        }

        if (marks >= 40) {
            return "E";
        }

        return "F";
    }


    /*
    ============================================
    SEARCH RESULTS
    ============================================
    */

    function searchResults() {

        const searchValue =
            document.getElementById("searchInput").value
            .trim()
            .toLowerCase();

        const message =
            document.getElementById("message");

        const results =
            document.getElementById("results");


        if (searchValue === "") {

            message.innerHTML =
                "Please enter a Student ID or Name.";

            results.style.display = "none";

            return;
        }


        const student = students.find(function(student) {

            return (
                student.id.toLowerCase() === searchValue ||
                student.name.toLowerCase().includes(searchValue)
            );

        });


        if (!student) {

            message.innerHTML =
                "❌ Student results not found.";

            results.style.display = "none";

            return;
        }


        message.innerHTML = "";


        document.getElementById("studentName").innerText =
            student.name;

        document.getElementById("studentID").innerText =
            student.id;

        document.getElementById("studentClass").innerText =
            student.class;


        const table =
            document.getElementById("resultsTable");

        table.innerHTML = "";


        let total = 0;


        student.results.forEach(function(result) {

            total += result.marks;

            const grade = getGrade(result.marks);

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${result.subject}</td>
                <td>${result.marks}</td>
                <td>${grade}</td>
            `;

            table.appendChild(row);

        });


        const average =
            total / student.results.length;


        document.getElementById("totalMarks").innerText =
            total;

        document.getElementById("averageMarks").innerText =
            average.toFixed(2);


        results.style.display = "block";
    }

</script>

</body>
</html>
